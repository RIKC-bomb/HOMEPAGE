<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>bomb</title>
  <meta name="robots" content="index, follow, noai, noimageai" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <script src="fonts.js"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VSG4890EV9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VSG4890EV9');
  </script>

  <style>
    :root { --accent: #2b47d9; --ink: #0a0a0a; --muted: #6b6b6b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #fff; }
    body {
      font-family: var(--font, "Yu Mincho", YuMincho, "Hiragino Mincho ProN", serif);
      color: var(--ink); text-transform: lowercase; font-synthesis: none;
      -webkit-user-select: none; user-select: none; touch-action: none;
    }
    /* seep 背景（点からの色拡散・白へフェード） */
    #seep { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; filter: blur(9px); opacity: 0.9; }
    .cv-viewport {
      position: fixed; inset: 0; overflow: hidden; cursor: grab; z-index: 1;
      background-image: radial-gradient(circle, rgba(60,60,60,0.10) 1.2px, transparent 1.2px);
      background-size: 46px 46px;
    }
    .cv-viewport.grab { cursor: grabbing; }
    .cv-space { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
    .cv-tile { position: absolute; top: 0; left: 0; }
    .node { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; }
    .node.title { font-weight: 900; font-size: clamp(4rem, 12vw, 9rem); color: var(--ink); }
    .node.title a { color: inherit; text-decoration: none; }
    .node.word { font-size: clamp(1rem, 2.6vw, 1.45rem); color: var(--muted); cursor: pointer; transition: color .15s; }
    .node.word:hover { color: var(--accent); }
    .node.fact { font-size: 0.82rem; color: #8f8f8f; letter-spacing: 0.06em; }
    .node.act { font-size: 0.92rem; color: var(--accent); cursor: pointer; }
    .node.act:hover { text-decoration: underline; }

    .sheet { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 28px; z-index: 50; background: rgba(255,255,255,0.86); backdrop-filter: blur(6px); }
    .sheet.open { display: flex; }
    .sheet-inner { max-width: 640px; text-align: left; }
    .sheet-title { font-weight: 900; font-size: clamp(2.5rem, 9vw, 4.5rem); line-height: 1.05; }
    .sheet-reading { color: var(--muted); margin-top: 6px; letter-spacing: 0.12em; }
    .sheet-desc { font-size: 1.05rem; line-height: 2; color: #333; margin-top: 24px; text-transform: none; }
    .sheet-close { margin-top: 28px; color: var(--muted); font-size: 0.85rem; cursor: pointer; letter-spacing: 0.1em; }
    .sheet-close:hover { color: var(--ink); }

    .dims { position: fixed; bottom: 16px; left: 0; right: 0; text-align: center; z-index: 40; font-size: 0.8rem; }
    .dims a { color: #999; text-decoration: none; margin: 0 9px; text-transform: none; }
    .dims a:hover { color: var(--accent); }
    .hint { position: fixed; top: 16px; left: 0; right: 0; text-align: center; color: #aaa; font-size: 0.8rem; z-index: 40; transition: opacity .6s; pointer-events: none; }
    .hint.gone { opacity: 0; }
    .lang { position: fixed; top: 14px; right: 16px; z-index: 41; font-size: 0.8rem; }
    .lang a { color: var(--muted); text-decoration: none; border: 1px solid #e3e3e3; border-radius: 999px; padding: 2px 11px; background: rgba(255,255,255,0.7); }
  </style>
</head>
<body>
  <canvas id="seep"></canvas>
  <div class="cv-viewport" id="vp">
    <div class="cv-space" id="space"></div>
  </div>

  <div class="lang"><a href="#" id="langlink">EN</a></div>
  <div class="hint" id="hint">ドラッグで探索・ピンチで拡大 — どこまでも循環します</div>
  <div class="dims" id="dims"></div>

  <div class="sheet" id="sheet">
    <div class="sheet-inner">
      <h1 class="sheet-title" id="s-title"></h1>
      <p class="sheet-reading" id="s-reading"></p>
      <p class="sheet-desc" id="s-desc"></p>
      <p class="sheet-close" id="s-close">× とじる</p>
    </div>
  </div>

  <script>
    var LANG = (new URLSearchParams(location.search).get('lang') === 'en') ? 'en' : 'ja';
    document.documentElement.lang = LANG;

    /* ===== seep 背景：逆距離加重(IDW)で点の色を拡散、白へフェード ===== */
    function renderSeep() {
      var cv = document.getElementById('seep');
      var w = window.innerWidth, h = window.innerHeight;
      cv.width = w; cv.height = h;
      var cols = 64, rows = Math.max(8, Math.round(64 * h / w));
      var off = document.createElement('canvas'); off.width = cols; off.height = rows;
      var octx = off.getContext('2d');
      var img = octx.createImageData(cols, rows);
      var POW = 1.2, EMP = 2.0, GRAD = 0.10, MAXB = 3, MIND = 1.0;
      function hsl(h, sa, l) {
        var c = (1 - Math.abs(2 * l - 1)) * sa, x = c * (1 - Math.abs((h / 60) % 2 - 1)), mm = l - c / 2, r, g, b;
        if (h < 60) { r = c; g = x; b = 0; } else if (h < 120) { r = x; g = c; b = 0; }
        else if (h < 180) { r = 0; g = c; b = x; } else if (h < 240) { r = 0; g = x; b = c; }
        else if (h < 300) { r = x; g = 0; b = c; } else { r = c; g = 0; b = x; }
        return [(r + mm) * 255, (g + mm) * 255, (b + mm) * 255];
      }
      // flow: ランダムな流線（曲線）を発生源に。始点→終点で引力を補間し、距離でIDW拡散。
      var N = 4 + Math.floor(Math.random() * 3);
      var curves = [];
      for (var i = 0; i < N; i++) {
        var col = hsl(Math.random() * 360, 0.74, 0.56);
        var x = Math.random() * cols, y = Math.random() * rows, ang = Math.random() * Math.PI * 2;
        var steps = 7 + Math.floor(Math.random() * 5);
        var seg = ((cols + rows) / 2) / steps * 1.5;
        var raw = [];
        for (var st = 0; st <= steps; st++) { raw.push([x, y]); ang += (Math.random() - 0.5) * 1.3; x += Math.cos(ang) * seg; y += Math.sin(ang) * seg; }
        var samples = [], sub = 4, tot1 = raw.length - 1;
        for (var aa = 0; aa < tot1; aa++) {
          for (var bb = 0; bb < sub; bb++) {
            var tt = (aa + bb / sub) / tot1;
            samples.push([raw[aa][0] + (raw[aa + 1][0] - raw[aa][0]) * (bb / sub), raw[aa][1] + (raw[aa + 1][1] - raw[aa][1]) * (bb / sub), tt]);
          }
        }
        samples.push([raw[tot1][0], raw[tot1][1], 1]);
        curves.push({ samples: samples, fs: 3 + Math.random() * 6, fe: 3 + Math.random() * 6, r: col[0], g: col[1], b: col[2] });
      }
      for (var yy = 0; yy < rows; yy++) {
        for (var xx = 0; xx < cols; xx++) {
          var inf = [];
          for (var k = 0; k < curves.length; k++) {
            var cu = curves[k], best = 1e9, bt = 0;
            for (var si = 0; si < cu.samples.length; si++) {
              var ddx = xx - cu.samples[si][0], ddy = yy - cu.samples[si][1], d2 = ddx * ddx + ddy * ddy;
              if (d2 < best) { best = d2; bt = cu.samples[si][2]; }
            }
            var dist = Math.sqrt(best); if (dist < MIND) dist = MIND;
            var force = cu.fs + (cu.fe - cu.fs) * bt;
            inf.push({ v: Math.pow(force, EMP) / Math.pow(dist, POW), s: cu });
          }
          inf.sort(function (a, b) { return b.v - a.v; });
          inf = inf.slice(0, MAXB);
          var tot = 0; for (var m = 0; m < inf.length; m++) tot += inf[m].v;
          var idx = (yy * cols + xx) * 4;
          var r = 255, g = 255, b = 255;
          if (tot > 0.001) {
            r = g = b = 0;
            for (var m2 = 0; m2 < inf.length; m2++) { r += inf[m2].s.r * inf[m2].v; g += inf[m2].s.g * inf[m2].v; b += inf[m2].s.b * inf[m2].v; }
            r /= tot; g /= tot; b /= tot;
            var tw = GRAD / (GRAD + tot); if (tw < 0) tw = 0; if (tw > 1) tw = 1;
            r = r + (255 - r) * tw; g = g + (255 - g) * tw; b = b + (255 - b) * tw;
          }
          img.data[idx] = r; img.data[idx + 1] = g; img.data[idx + 2] = b; img.data[idx + 3] = 255;
        }
      }
      octx.putImageData(img, 0, 0);
      var ctx = cv.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(off, 0, 0, cols, rows, 0, 0, w, h);
    }
    renderSeep();
    window.addEventListener('resize', renderSeep);

    /* ===== nodes ===== */
    var DATA = {
      modeling:{k:'モデリング',ja:'3DCGで「形」を作る工程。ポリゴンやNURBSで物体や空間のかたちを一から構築する。',en:'Building 3D form from scratch with polygons or NURBS.'},
      sculpting:{k:'スカルプティング',ja:'粘土をこねるように3Dモデルを彫り込む手法。有機的で繊細な造形に向く。',en:'Shaping a 3D model like clay — ideal for organic, detailed forms.'},
      texturing:{k:'テクスチャリング',ja:'モデルの表面に色や質感を与え、素材としての説得力を作る工程。',en:'Giving surfaces color and material so they feel real.'},
      lighting:{k:'ライティング',ja:'3D空間に光を配置し、陰影・空気・時間帯・感情をつくる工程。',en:'Placing light to shape shadow, atmosphere and emotion.'},
      animation:{k:'アニメーション',ja:'キーフレームで「こう動かしたい」を手付けする工程。',en:'Authoring intended motion by hand with keyframes.'},
      rendering:{k:'レンダリング',ja:'3Dシーンを計算し、最終的な画像・映像へ焼き上げる工程。',en:'Computing a 3D scene into the final image or film.'},
      coding:{k:'コーディング',ja:'コードを書く行為全般。自動化やツール作りを含む総称。',en:'Writing code — the umbrella for automation and tools.'},
      scripting:{k:'スクリプティング',ja:'既存ソフトの中で動く小さなコード。自動化や手続き的生成を担う。',en:'Small code inside software to automate and generate.'},
      programming:{k:'プログラミング',ja:'独立したソフトやシステム、制作パイプラインを設計・構築する。',en:'Building standalone software, systems and pipelines.'},
      generation:{k:'ジェネレーション',ja:'ルールやアルゴリズムから形・パターンを生成する。',en:'Creating form and pattern from rules and algorithms.'},
      calculation:{k:'カリキュレーション',ja:'数値計算。形状・物理・最適化などの土台になる演算。',en:'Numerical computation behind geometry and physics.'},
      simulation:{k:'シミュレーション',ja:'物理やルールで動き・現象を計算する（流体・布・破壊など）。',en:'Computing motion and phenomena by physics — fluids, cloth, destruction.'},
      speculation:{k:'スペキュレーション',ja:'まだ無い未来や世界を構想し、ありえる姿を思索する。bombの核。',en:'Envisioning futures that do not yet exist. The core of bomb.'},
      visualization:{k:'ビジュアライゼーション',ja:'データや構想を、人が直感で掴める画像・映像へ翻訳する。',en:'Translating data and ideas into images one can grasp.'},
      perspective:{k:'パースペクティブ',ja:'視点。世界の見え方そのもの。すべてが最後に立ち返る軸。',en:'A point of view — how the world is seen. Where all returns.'}
    };
    var WORDS = ['modeling','sculpting','texturing','lighting','animation','rendering','coding','scripting','programming','generation','calculation','simulation','speculation','visualization','perspective'];
    var FACTS = (LANG === 'en')
      ? [{t:'2026'},{t:'bomb LLC'},{t:'Riku Sato'},{t:'founded 20260401'},{t:'Minami-Aoyama, Tokyo'},{t:'4-17-33'},{t:'info@bomb.co.jp',act:'mail'},{t:'recruit →',act:'recruit'}]
      : [{t:'2026'},{t:'合同会社 bomb'},{t:'佐藤陸'},{t:'設立 20260401'},{t:'東京・南青山'},{t:'4-17-33'},{t:'info@bomb.co.jp',act:'mail'},{t:'recruit →',act:'recruit'}];

    var W = 1900, H = 1400, cx = W / 2, cy = H / 2;
    var nodes = [{ type: 'title', label: 'bomb', x: cx, y: cy }];
    var items = [];
    WORDS.forEach(function (w) { items.push({ type: 'word', key: w, label: w }); });
    FACTS.forEach(function (f) { items.push({ type: f.act ? 'act' : 'fact', label: f.t, act: f.act }); });
    var golden = Math.PI * (3 - Math.sqrt(5));
    items.forEach(function (it, n) {
      var ang = n * golden, r = 360 + 100 * Math.sqrt(n);
      it.x = cx + Math.cos(ang) * r; it.y = cy + Math.sin(ang) * r * 0.78;
      nodes.push(it);
    });

    function buildTile() {
      var t = document.createElement('div');
      t.className = 'cv-tile'; t.style.width = W + 'px'; t.style.height = H + 'px';
      nodes.forEach(function (n) {
        var el;
        if (n.type === 'title') {
          el = document.createElement('div'); el.className = 'node title';
          var a = document.createElement('a');
          a.href = (LANG === 'en' ? 'https://en.wikipedia.org/wiki/Future_of_Earth' : 'https://ja.wikipedia.org/wiki/%E5%9C%B0%E7%90%83%E3%81%AE%E6%9C%AA%E6%9D%A5');
          a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'bomb';
          el.appendChild(a);
        } else if (n.type === 'word') {
          el = document.createElement('div'); el.className = 'node word';
          el.textContent = n.label; el.setAttribute('data-key', n.key);
        } else if (n.type === 'act') {
          el = document.createElement('div'); el.className = 'node act';
          el.textContent = n.label; el.setAttribute('data-act', n.act);
        } else {
          el = document.createElement('div'); el.className = 'node fact';
          el.textContent = n.label;
        }
        el.style.left = n.x + 'px'; el.style.top = n.y + 'px';
        t.appendChild(el);
      });
      return t;
    }

    var space = document.getElementById('space');
    for (var gx = 0; gx < 5; gx++) {
      for (var gy = 0; gy < 5; gy++) {
        var tile = buildTile();
        tile.style.transform = 'translate(' + (gx * W) + 'px,' + (gy * H) + 'px)';
        space.appendChild(tile);
      }
    }

    /* ===== pan + zoom + loop ===== */
    var vp = document.getElementById('vp');
    var s = 1, ox = window.innerWidth / 2 - cx, oy = window.innerHeight / 2 - cy;
    function wrap(v, m) { v = v % m; if (v > 0) v -= m; return v; }
    function apply() {
      space.style.transform = 'translate(' + wrap(ox, W * s) + 'px,' + wrap(oy, H * s) + 'px) scale(' + s + ')';
      var g = 46 * s;
      vp.style.backgroundSize = g + 'px ' + g + 'px';
      vp.style.backgroundPosition = wrap(ox, g) + 'px ' + wrap(oy, g) + 'px';
    }
    apply();
    function zoomAt(mx, my, factor) {
      var ns = Math.max(0.4, Math.min(3.2, s * factor));
      ox = mx - (mx - ox) * (ns / s); oy = my - (my - oy) * (ns / s); s = ns; apply();
    }

    var dragging = false, moved = 0, lx = 0, ly = 0;
    function down(x, y) { dragging = true; moved = 0; lx = x; ly = y; vp.classList.add('grab'); }
    function move(x, y) {
      if (!dragging) return;
      var dx = x - lx, dy = y - ly; lx = x; ly = y;
      moved += Math.abs(dx) + Math.abs(dy);
      ox += dx; oy += dy; apply();
      if (moved > 8) { var hh = document.getElementById('hint'); if (hh) hh.classList.add('gone'); }
    }
    function up() { dragging = false; vp.classList.remove('grab'); }

    vp.addEventListener('mousedown', function (e) { down(e.clientX, e.clientY); });
    window.addEventListener('mousemove', function (e) { move(e.clientX, e.clientY); });
    window.addEventListener('mouseup', up);

    // ホイール：通常=パン / ctrl・meta（=トラックパッドのピンチ）=ズーム
    vp.addEventListener('wheel', function (e) {
      e.preventDefault();
      if (e.ctrlKey || e.metaKey) { zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.01)); }
      else { ox -= e.deltaX; oy -= e.deltaY; moved = 99; apply(); }
    }, { passive: false });

    // タッチ：1本=パン / 2本=ピンチズーム
    var pinchDist = 0, pinching = false;
    function tdist(e) { var a = e.touches[0], b = e.touches[1]; var dx = a.clientX - b.clientX, dy = a.clientY - b.clientY; return Math.sqrt(dx * dx + dy * dy); }
    function tmid(e) { return { x: (e.touches[0].clientX + e.touches[1].clientX) / 2, y: (e.touches[0].clientY + e.touches[1].clientY) / 2 }; }
    vp.addEventListener('touchstart', function (e) {
      if (e.touches.length === 2) { pinching = true; pinchDist = tdist(e); }
      else if (e.touches.length === 1) { pinching = false; down(e.touches[0].clientX, e.touches[0].clientY); }
    }, { passive: true });
    window.addEventListener('touchmove', function (e) {
      if (pinching && e.touches.length === 2) {
        var nd = tdist(e), mid = tmid(e);
        if (pinchDist > 0) zoomAt(mid.x, mid.y, nd / pinchDist);
        pinchDist = nd;
      } else if (!pinching && e.touches.length === 1) { move(e.touches[0].clientX, e.touches[0].clientY); }
    }, { passive: true });
    window.addEventListener('touchend', function (e) {
      if (e.touches.length < 2) pinching = false;
      if (e.touches.length === 1) down(e.touches[0].clientX, e.touches[0].clientY);
      else if (e.touches.length === 0) up();
    });

    /* ===== sheet / links ===== */
    var sheet = document.getElementById('sheet');
    function openSheet(key) {
      var d = DATA[key]; if (!d) return;
      document.getElementById('s-title').textContent = key;
      document.getElementById('s-reading').textContent = LANG === 'ja' ? d.k : '';
      document.getElementById('s-desc').innerHTML = d[LANG];
      document.getElementById('s-close').textContent = LANG === 'en' ? '× close' : '× とじる';
      sheet.classList.add('open');
    }
    function closeSheet() { sheet.classList.remove('open'); }
    vp.addEventListener('click', function (e) {
      if (moved > 8) return;
      var k = e.target.closest('[data-key]');
      if (k) { openSheet(k.getAttribute('data-key')); return; }
      var a = e.target.closest('[data-act]');
      if (a) {
        var act = a.getAttribute('data-act');
        if (act === 'mail') location.href = 'mailto:info@bomb.co.jp';
        else if (act === 'recruit') location.href = (LANG === 'en') ? 'en/recruit.html' : 'recruit.html';
      }
    });
    sheet.addEventListener('click', function (e) { if (e.target === sheet || e.target.id === 's-close') closeSheet(); });
    window.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

    var dims = document.getElementById('dims');
    var dimLinks = LANG === 'en'
      ? [['Recruit','en/recruit.html'],['Privacy','en/privacy.html'],['Legal','en/legal.html'],['Credits','en/credits.html']]
      : [['Recruit','recruit.html'],['Privacy','privacy.html'],['Legal','legal.html'],['Credits','credits.html']];
    dims.innerHTML = dimLinks.map(function (l) { return '<a href="' + l[1] + '">' + l[0] + '</a>'; }).join('·');

    var ll = document.getElementById('langlink');
    if (LANG === 'en') { ll.textContent = 'JP'; ll.href = 'canvas.html'; document.getElementById('hint').textContent = 'drag to explore · pinch to zoom — it loops forever'; }
    else { ll.textContent = 'EN'; ll.href = 'canvas.html?lang=en'; }
  </script>
</body>
</html>
