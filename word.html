<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bomb</title>
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#1a499e" />
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VSG4890EV9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VSG4890EV9');
  </script>

  <link rel="stylesheet" href="style.css" />
</head>
<body class="word-page">
  <header class="site-header">
    <a href="/" class="logo">bomb</a>
    <nav class="nav"></nav>
  </header>

  <main class="word-main">
    <h1 class="word-title" id="w-title">—</h1>
    <p class="word-reading" id="w-reading"></p>
    <p class="word-desc" id="w-desc"></p>

    <p><a href="/" class="back-link" id="w-back" data-i18n="w_back">← 戻る</a></p>
  </main>

  <script>
    // Reading (kana) per word — descriptions live in i18n.js (keys d_<word>).
    var KANA = {
      modeling:'モデリング', sculpting:'スカルプティング', texturing:'テクスチャリング',
      lighting:'ライティング', animation:'アニメーション', rendering:'レンダリング',
      coding:'コーディング', scripting:'スクリプティング', programming:'プログラミング',
      generation:'ジェネレーション', calculation:'カリキュレーション', simulation:'シミュレーション',
      speculation:'スペキュレーション', visualization:'ビジュアライゼーション', perspective:'パースペクティブ'
    };

    var p = new URLSearchParams(location.search);
    var w = (p.get('w') || '').toLowerCase();
    // A language hint passed from a localized link seeds the choice only on first visit.
    try { var hint = p.get('lang'); if (hint && !localStorage.getItem('lang')) localStorage.setItem('lang', hint); } catch (e) {}

    function $(id) { return document.getElementById(id); }
    if (KANA[w]) {
      $('w-title').textContent = w;
      $('w-reading').textContent = KANA[w];
      $('w-desc').setAttribute('data-i18n', 'd_' + w); // filled by i18n.js
      document.title = w + ' — bomb';
    } else {
      // Unknown word: link to the full list (no translation on these links).
      $('w-title').textContent = 'bomb';
      $('w-desc').innerHTML = Object.keys(KANA).map(function (k) {
        return '<a href="word.html?w=' + k + '">' + k + '</a>';
      }).join('　');
    }
  </script>
  <script src="i18n.js"></script>
</body>
</html>
